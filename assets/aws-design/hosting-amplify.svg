<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 690" role="img" aria-labelledby="title"><title id="title">Amplify Hostingの構成とWAFの関連付け先</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647c"/></marker></defs><rect width="680" height="690" rx="16" fill="#f3f6fa"/><g font-family="sans-serif" text-anchor="middle" fill="#182b45"><text x="340" y="40" font-size="26" font-weight="700">Amplify Hosting</text><text x="340" y="71" font-size="17">緑枠：WAFを追加できる関連付け先</text><rect x="24" y="98" width="632" height="90" rx="12" fill="white" stroke="#849bb7"/><text x="340" y="132" font-size="22" font-weight="700">利用者</text><text x="340" y="163" font-size="17">HTTPSでアクセスする</text><path d="M340 190V212" fill="none" stroke="#52647c" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="220" width="632" height="136" rx="12" fill="white" stroke="#849bb7"/><text x="340" y="254" font-size="22" font-weight="700">Amplify Hostingアプリ</text><text x="340" y="285" font-size="17">AWSが管理する配信基盤で公開する</text><rect x="40" y="300" width="600" height="40" rx="8" fill="#e5f7eb" stroke="#26764a"/><text x="340" y="326" font-size="19" font-weight="700" fill="#165b35">AWS WAF → Amplifyアプリへ統合（任意）</text><path d="M340 358V380" fill="none" stroke="#52647c" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="388" width="632" height="90" rx="12" fill="white" stroke="#849bb7"/><text x="340" y="422" font-size="22" font-weight="700">静的コンテンツ／対応SSRランタイム</text><text x="340" y="453" font-size="17">アプリケーションの実行方式に合わせて選択する</text><rect x="24" y="510" width="632" height="90" rx="12" fill="white" stroke="#849bb7"/><text x="340" y="544" font-size="22" font-weight="700">デプロイ経路：Git → ビルド → 公開</text><text x="340" y="575" font-size="17">この経路は利用者からのリクエスト経路とは別に扱う</text><text x="340" y="644" font-size="16">別URLのAPIは別途保護する／利用者管理のALBは不要</text></g></svg>