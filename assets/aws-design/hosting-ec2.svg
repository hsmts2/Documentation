<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 690" role="img" aria-labelledby="title"><title id="title">EC2＋ALBの構成とWAFの関連付け先</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647c"/></marker></defs><rect width="680" height="690" rx="16" fill="#f3f6fa"/><g font-family="sans-serif" text-anchor="middle" fill="#182b45"><text x="340" y="40" font-size="26" font-weight="700">EC2＋ALB</text><text x="340" y="71" font-size="17">緑枠：WAFを追加できる関連付け先</text><rect x="24" y="98" width="632" height="90" rx="12" fill="white" stroke="#849bb7"/><text x="340" y="132" font-size="22" font-weight="700">利用者</text><text x="340" y="163" font-size="17">HTTPSでアクセスする</text><path d="M340 190V212" fill="none" stroke="#52647c" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="220" width="632" height="136" rx="12" fill="white" stroke="#849bb7"/><text x="340" y="254" font-size="22" font-weight="700">ALB</text><text x="340" y="285" font-size="17">2つ以上のAZで受け付ける</text><rect x="40" y="300" width="600" height="40" rx="8" fill="#e5f7eb" stroke="#26764a"/><text x="340" y="326" font-size="19" font-weight="700" fill="#165b35">AWS WAF → ALBへ関連付け（任意）</text><path d="M340 358V380" fill="none" stroke="#52647c" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="388" width="632" height="90" rx="12" fill="white" stroke="#849bb7"/><text x="340" y="422" font-size="22" font-weight="700">EC2：AZ A ／ EC2：AZ B</text><text x="340" y="453" font-size="17">非公開サブネット／ALBからの通信を許可する</text><path d="M340 480V502" fill="none" stroke="#52647c" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="510" width="632" height="90" rx="12" fill="white" stroke="#849bb7"/><text x="340" y="544" font-size="22" font-weight="700">RDS for MySQL：Multi-AZ</text><text x="340" y="575" font-size="17">EC2からのみ接続／障害切替後の再接続を設計する</text><text x="340" y="644" font-size="16">EC2への直接関連付けは不可／NLBも直接関連付けの対象外</text></g></svg>